[http]
listen = "127.0.0.1:8080"
max_request_bytes = 524_288
default_page_size = 20
max_page_size = 100

[database]
endpoint = "127.0.0.1:3306"
name = "appdb"
username = "example_user"
# Supply the password through MYSQL_PASSWORD in the process environment.
max_connections = 4
acquire_timeout_ms = 5_000
lock_wait_timeout_secs = 3

[test_user]
user_id = 1

[scheduler]
pending_max_count = 128
workers = ["http://127.0.0.1:50051"]
poll_interval_ms = 100
retry_interval_ms = 1_000

[grpc]
submit_timeout_ms = 1_000
get_timeout_ms = 1_000
ack_timeout_ms = 1_000
max_request_bytes = 16_777_216
max_response_bytes = 1_048_576

[health]
interval_ms = 5_000
timeout_ms = 1_000

[request]
source_max_bytes = 65_536
case_max_count = 128
input_max_bytes = 65_536
expected_output_max_bytes = 65_536
payload_max_bytes = 8_388_608
max_run_cpu_time_ms = 10_000
max_run_wall_time_ms = 15_000
max_run_memory_kib = 524_288

[results]
compile_diagnostic_max_bytes = 65_536
stdout_max_bytes = 65_536
stderr_max_bytes = 65_536
failure_diagnostic_max_bytes = 512

[logging]
level = "info"

[kafka]
bootstrap_servers = ["localhost:9092"]
tasks_topic = "acorn.judge.tasks.v1"
events_topic = "acorn.judge.events.v1"
group_id = "acorn-backend-judge-events-v1"
delivery_timeout_ms = 30_000
queue_timeout_ms = 1_000
commit_timeout_ms = 5_000
shutdown_timeout_ms = 5_000
max_task_record_bytes = 16_777_216
max_event_record_bytes = 1_048_576

[worker_membership]
tasks_group_id = "acorn-judge-workers-v1"
interval_ms = 5_000
timeout_ms = 1_000

[llm_review]
enabled = false
endpoint = "https://api.deepseek.com/responses"
# Fill this server-side credential only when enabling reviews.
api_key = ""
model = "deepseek-flash"
reasoning_effort = "max"
timeout_ms = 120_000
max_concurrent = 2
pending_max_count = 16
max_output_tokens = 10_240
max_request_bytes = 1_048_576
max_response_bytes = 1_048_576
