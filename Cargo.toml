[workspace]
members = ["crates/protocol", "crates/worker", "crates/backend"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
missing_docs_in_private_items = "deny"

[workspace.dependencies]
acorn-protocol = { path = "crates/protocol" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
nix = { version = "0.30", features = ["signal", "fs"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
