[workspace]
members = ["crates/protocol", "crates/kafka", "crates/worker", "crates/backend"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
missing_docs_in_private_items = "deny"

[workspace.dependencies]
acorn-kafka = { path = "crates/kafka", default-features = false }
acorn-protocol = { path = "crates/protocol" }
anyhow = "1"
argon2 = { version = "0.5.3", default-features = false, features = ["std"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
getrandom = { version = "0.4.3", features = ["std"] }
nix = { version = "0.30", features = ["signal", "fs"] }
prost = "0.14"
rdkafka = { version = "0.39.0", default-features = false, features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "mysql-rsa"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.9"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
